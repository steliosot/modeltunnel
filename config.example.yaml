server:
  host: "127.0.0.1"
  port: 8080
  # Optional: Enable admin panel authentication for public tunnel access
  admin:
    enabled: true
    username: "admin"
    password: "changeme"  # CHANGE THIS in production!

upstreams:
  ollama:
    type: ollama
    base_url: "http://127.0.0.1:11434"

policies:
  default:
    rate_limit: "60/min"
    max_tokens: 4096

intents:
  code:
    priority:
      - "default/qwen2.5:latest"
      - "default/deepseek-coder:6.7b"
      - "default/codellama:7b"
    description: "Code-heavy tasks, programming assistance"
    temperature: 0.2
    max_tokens: 8192

  plan:
    priority:
      - "default/deepseek-r1:latest"
      - "default/mistral:latest"
    description: "Strategic planning, architectural decisions"
    temperature: 0.7
    max_tokens: 4096

  chat:
    priority:
      - "default/phi:latest"
      - "default/gemma:latest"
    description: "Conversational AI, quick questions"
    temperature: 0.8
    max_tokens: 2048