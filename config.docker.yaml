# Docker configuration for Modeltunnel
# This is the default config used inside Docker containers
# To use custom config, mount your config.yaml to /home/appuser/.config/modeltunnel/config.yaml
server:
  host: 0.0.0.0
  port: 8080

upstreams:
  default:
    type: ollama
    base_url: http://ollama:11434
  vllm:
    type: vllm
    base_url: http://vllm:8000

policies:
  default:
    rate_limit: 60/min
    max_tokens: 4096