# Docker configuration for Modeltunnel
# This is the default config used inside Docker containers
# Bring your own backends (Ollama/vLLM) and point the URLs below
server:
  host: 0.0.0.0
  port: 8080

upstreams:
  default:
    type: ollama
    base_url: http://127.0.0.1:11434
    model: llama3
  vllm:
    type: vllm
    base_url: http://127.0.0.1:8000

policies:
  default:
    rate_limit: 60/min
    max_tokens: 4096

intents:
  chat:
    priority:
      - phi
      - tinyllama:latest
      - mistral:latest
    description: General conversation
    temperature: 0.7
    max_tokens: 1000
  code:
    priority:
      - deepseek-coder:6.7b
      - mistral:latest
      - phi3:latest
    description: Programming
    temperature: 0.2
    max_tokens: 4096

keys: []
providers: []
