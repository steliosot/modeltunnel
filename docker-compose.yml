services:
  ollama:
    image: ollama/ollama:latest
    container_name: modeltunnel-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Ollama serves on all interfaces for container-to-container communication
    environment:
      - OLLAMA_HOST=0.0.0.0

  modeltunnel:
    image: ghcr.io/steliosot/modeltunnel:latest
    container_name: modeltunnel-app
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./config.compose.yaml:/home/appuser/.config/modeltunnel/config.yaml:ro
    command: ["up"]

volumes:
  ollama_data:
  config_data: