server:
  host: 127.0.0.1
  port: 8080

upstreams:
  default:
    type: ollama
    base_url: http://127.0.0.1:11434
  vllm:
    type: vllm
    base_url: http://127.0.0.1:8000

policies:
  default:
    rate_limit: 60/min
    max_tokens: 4096

intents:
  chat:
    priority:
      - llama3
      - mistral
      - phi
      - tinyllama
    description: General conversation
    temperature: 0.7
    max_tokens: 1000
  code:
    priority:
      - deepseek-coder:6.7b
      - codellama:7b
      - mistral
    description: Programming
    temperature: 0.2
    max_tokens: 4096
  plan:
    priority:
      - qwen2.5
      - mistral
      - llama3
    description: Planning and reasoning
    temperature: 0.3
    max_tokens: 4000

keys: []
